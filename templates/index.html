<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Task Manager</h1>

        <form class="task-form" action="/add" method="post">
            <input name="title" placeholder="Title" required>
            <select name="priority">
                <option value="Low">Low</option>
                <option value="Med">Med</option>
                <option value="High">High</option>
            </select>
            <input type="date" name="due" required>
            <button type="submit">Add Task</button>
        </form>

        <h2>Tasks</h2>

        <form class="search-form" action ="/" method="get">
            <input name="query" value="{{ query }}" placeholder="Search Task">
            <button type="submit">Search</button>
        </form>

        {% if tasks %}
            <ul>
                {% for task in tasks %}
                    <li>
                        <strong>{{ task.id }}</strong>
                        <span>{{ task.title }}</span>
                        <span>{{ task.priority }}</span>
                        <span>{{ task.due }}</span>

                        {% if task.status %}
                            <span class="task-status">Complete</span>
                        {% else %}
                            <span class="task-status incomplete">Incomplete</span>
                        <form action="/complete/{{ task.id }}" method="post">
                            <button class="complete-btn" type="submit">Complete</button>
                        </form>
                        {% endif %}
                        <form action="/delete/{{ task.id }}" method="post">
                            <button class="delete-btn" type="submit">Delete</button>
                        </form>
                        <a class="button-link" href="/edit/{{ task.id }}">Edit</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty">No tasks found.</p>
        {% endif %}
    </main>

</body>
</html>
