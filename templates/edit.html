<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Task Manager</h1>
        <h2>Edit Task</h2>
        <form class="edit-form" action="/edit/{{ task.id }}" method="post">
            <label class="field-group">
                <span class="field-label">Title</span>
                <input name="title" value="{{ task.title }}" placeholder="Title" required>
            </label>
            <label class="field-group">
                <span class="field-label">Priority</span>
                <select name="priority">
                    <option value="Low" {{ "selected" if task.priority == "Low" else "" }}>Low</option>
                    <option value="Med" {{ "selected" if task.priority == "Med" else "" }}>Med</option>
                    <option value="High" {{ "selected" if task.priority == "High" else "" }}>High</option>
                </select>
            </label>
            <label class="field-group">
                <span class="field-label">Date</span>
                <input type="date" name="due" value="{{ task.due }}" required>
            </label>
            {% if task.status %}
            <label>
                <span class="field-label">Complete</span>
                <input type="checkbox" name="status" checked>
            </label>
            {% endif %}
            <div class="actions">
                <button type="submit">Save</button>
            </div>
        </form>
        <a class="button-link" href="/">Cancel</a>
    </main>
</body>
</html>
